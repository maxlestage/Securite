[package]
name = "securite-server"
version = "0.1.0"
description = "Web server of the securite website: pages rendered with active, live attack playground, protected by the securite crate (dogfooding)."
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
# The web server, with Brotli and gzip for the pages, the stylesheet and the bundle.
vitesse = { version = "0.2", git = "https://github.com/maxlestage/Vitesse", default-features = false, features = ["compress"] }
securite = { path = "../crates/securite" }
securite-site = { path = "../site" }
serde_json = "1"
# securite writes its security events with tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `#[tokio::test]`: the tests call the server through Vitesse's test client.
tokio = { version = "1", features = ["macros", "rt"] }
