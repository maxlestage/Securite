[package]
name = "securite"
version = "0.2.0"
description = "Fast, easy, batteries-included security middlewares for Vitesse (and any tower / hyper service): security headers & CSP, rate limiting, WAF, CSRF, CORS, IP filtering, auto-ban, auth, HMAC webhooks and more."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
homepage = "https://securite-2db4c1994be7.herokuapp.com/"
repository = "https://github.com/maxlestage/Securite"
documentation = "https://docs.rs/securite"
readme = "README.md"
keywords = ["security", "middleware", "vitesse", "tower", "waf"]
categories = ["web-programming::http-server", "network-programming", "authentication", "cryptography"]
exclude = ["/benches/results"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["vitesse", "password", "crypt"]
## The shield as a Vitesse middleware: `app.middleware(Shield::recommended())`.
vitesse = ["dep:vitesse"]
## Argon2id password hashing (`securite::password`).
password = ["dep:argon2"]
## Authenticated encryption à la Laravel `Crypt` and encrypted cookies
## (`securite::crypt`, XChaCha20-Poly1305 through the RustCrypto `chacha20poly1305` crate).
crypt = ["dep:chacha20poly1305"]
## JWT / JWKS validation (`securite::jwt`, `Auth::jwt`) through the `jsonwebtoken` crate.
jwt = ["dep:jsonwebtoken", "dep:serde_json"]
## Parsing of CSP violation reports (`securite::report`).
reports = ["dep:serde_json"]

[dependencies]
aho-corasick = "1.1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"], optional = true }
base64 = "0.23"
bytes = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
getrandom = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
pin-project-lite = "0.2"
serde_json = { version = "1", optional = true }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
vitesse = { version = "0.2", git = "https://github.com/maxlestage/Vitesse", default-features = false, optional = true }

[dev-dependencies]
vitesse = { version = "0.2", git = "https://github.com/maxlestage/Vitesse", default-features = false }
bytes = "1"
tower-layer = "0.3"
criterion = { version = "0.8", default-features = false }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "shield"
harness = false

[[example]]
name = "vitesse_basic"
required-features = ["vitesse"]

[[example]]
name = "vitesse_advanced"
required-features = ["vitesse"]
