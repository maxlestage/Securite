[package]
name = "securite"
version = "0.1.0"
description = "Fast, easy, batteries-included security middlewares for Vitesse (and any tower / hyper service): security headers & CSP, rate limiting, WAF, CSRF, CORS, IP filtering, auto-ban, auth, HMAC webhooks and more."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
homepage = "https://securite-2db4c1994be7.herokuapp.com/"
repository = "https://github.com/maxlestage/Securite"
documentation = "https://docs.rs/securite"
readme = "README.md"
keywords = ["security", "middleware", "vitesse", "tower", "waf"]
categories = ["web-programming::http-server", "network-programming", "authentication", "cryptography"]
exclude = ["/benches/results"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["vitesse"]
## The shield as a Vitesse middleware: `app.middleware(Shield::recommended())`.
vitesse = ["dep:vitesse"]

[dependencies]
aho-corasick = "1.1"
base64 = "0.23"
bytes = "1"
getrandom = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
sha2 = "0.11"
subtle = "2.6"
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
vitesse = { version = "0.1", git = "https://github.com/maxlestage/Vitesse", default-features = false, optional = true }

[dev-dependencies]
vitesse = { version = "0.1", git = "https://github.com/maxlestage/Vitesse", default-features = false }
bytes = "1"
tower-layer = "0.3"
criterion = { version = "0.8", default-features = false }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "shield"
harness = false

[[example]]
name = "vitesse_basic"
required-features = ["vitesse"]

[[example]]
name = "vitesse_advanced"
required-features = ["vitesse"]
