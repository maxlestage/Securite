[package]
name = "securite"
version = "0.1.0"
description = "Fast, easy, batteries-included security middlewares for tower / axum / hyper: security headers & CSP, rate limiting, WAF, CSRF, CORS, IP filtering, auto-ban, auth, HMAC webhooks and more."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://maxlestage.github.io/Securite/"
documentation = "https://docs.rs/securite"
readme = "README.md"
keywords = ["security", "middleware", "axum", "tower", "waf"]
categories = ["web-programming::http-server", "network-programming", "authentication", "cryptography"]
exclude = ["/benches/results"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["axum"]
## Reads the peer address from axum's `ConnectInfo<SocketAddr>` extension.
axum = ["dep:axum"]

[dependencies]
aho-corasick = "1.1"
base64 = "0.23"
bytes = "1"
getrandom = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
sha2 = "0.11"
subtle = "2.6"
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
axum = { version = "0.8", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
bytes = "1"
tower-layer = "0.3"
criterion = { version = "0.8", default-features = false }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "shield"
harness = false

[[example]]
name = "axum_basic"

[[example]]
name = "axum_advanced"
