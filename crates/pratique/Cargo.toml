[package]
name = "pratique"
version = "0.2.0"
description = "Everyday middlewares for Vitesse that have nothing to do with security: ETag & 304, Cache-Control, response cache, response time, trailing slash, redirects, maintenance mode, health checks, Prometheus metrics, access logs, default headers, locale negotiation and API deprecation."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
homepage = "https://securite-2db4c1994be7.herokuapp.com/"
repository = "https://github.com/maxlestage/Securite"
documentation = "https://docs.rs/pratique"
readme = "README.md"
keywords = ["middleware", "vitesse", "etag", "metrics", "cache"]
categories = ["web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## `RedisStore`: a `ResponseCache` shared by every instance of the app, in Redis or
## Valkey (needs Rust 1.88, like the `redis` crate).
redis = ["dep:redis"]
## `rediss://` (TLS) addresses for the `RedisStore`, with rustls and ring.
redis-tls = [
    "redis",
    "redis/tokio-rustls-comp",
    "redis/tls-rustls-webpki-roots",
    "redis/tls-rustls-insecure",
    "dep:rustls",
]

[dependencies]
vitesse = { version = "0.2", git = "https://github.com/maxlestage/Vitesse", default-features = false }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
# The crypto provider of rustls for `redis-tls` (rustls has none by default).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
