version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Pinned exactly: must match the wasm-bindgen CLI (the workflows and the
      # Dockerfile read its version from Cargo.lock / WASM_BINDGEN_VERSION).
      - dependency-name: wasm-bindgen
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Its refs are toolchain names (stable, 1.85…), not versions.
      - dependency-name: dtolnay/rust-toolchain
