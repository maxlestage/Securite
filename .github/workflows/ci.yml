name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: Crate · fmt, clippy, tests, docs, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc -p securite --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The package is verified by crates.io itself once vitesse (a git dependency
      # until it is published there) is on crates.io: its file list is checked here.
      - name: Package (crates.io)
        run: cargo package -p securite --list

  msrv:
    name: Crate · MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV is an input (not the action ref) so Dependabot never bumps it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p securite --all-features

  site:
    name: Website · active + WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Prebuilt wasm-bindgen CLI, same version as the wasm-bindgen crate in Cargo.lock.
      - name: Install wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version
      - name: clippy (browser bundle)
        run: cargo clippy -p securite-site --lib --target wasm32-unknown-unknown -- -D warnings
      # Same commands as the Dockerfile used by Heroku.
      - name: Build the browser bundle
        run: |
          cargo build -p securite-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/securite_site.wasm
          ls -l site/pkg
      - name: Build the server
        run: cargo build --release -p securite-server
      # Same command as pages.yml: the static copy for GitHub Pages.
      - name: Export the site as static files
        env:
          BASE_PATH: /Securite
          SITE_URL: https://maxlestage.github.io/Securite
        run: |
          ./target/release/securite-server export dist
          test -f dist/en/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest
