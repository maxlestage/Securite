name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The repositories are private: Cargo fetches the git dependencies (the other
  # repositories of the ecosystem) through git, which asks GitHub's credentials to a
  # helper reading the REPOS_TOKEN secret, a GitHub token that can read them. The
  # token stays out of every URL; without the secret, nothing changes.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: Crate · fmt, clippy, tests, docs, package
    runs-on: ubuntu-latest
    # For the tests of pratique's RedisStore (feature `redis`).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p pratique --all-features --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p pratique --all-features
        env:
          REDIS_URL: redis://127.0.0.1:6379/
      - run: cargo doc -p securite --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p pratique --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The package is verified by crates.io itself once vitesse (a git dependency
      # until it is published there) is on crates.io: its file list is checked here.
      - name: Package (crates.io)
        run: cargo package -p securite --list

  msrv:
    name: Crate · MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV is an input (not the action ref) so Dependabot never bumps it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p securite --all-features
      # Without features: the `redis` feature needs Rust 1.88, like the redis crate.
      - run: cargo check -p pratique

  site:
    name: Website · active + WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Prebuilt wasm-bindgen CLI, same version as the wasm-bindgen crate in Cargo.lock.
      - name: Install wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version
      - name: clippy (browser bundle)
        run: cargo clippy -p securite-site --lib --target wasm32-unknown-unknown -- -D warnings
      # Same commands as the Dockerfile used by Heroku.
      - name: Build the browser bundle
        run: |
          cargo build -p securite-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/securite_site.wasm
          ls -l site/pkg
      - name: Build the server
        run: cargo build --release -p securite-server
      # The static export of the site, kept working (served by no host).
      - name: Export the site as static files
        env:
          BASE_PATH: /Securite
          SITE_URL: https://maxlestage.github.io/Securite
        run: |
          ./target/release/securite-server export dist
          test -f dist/en/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest
