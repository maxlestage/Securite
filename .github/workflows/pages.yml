# Deploys the website to GitHub Pages:
#   https://<owner>.github.io/<repository>/
#
# `securite-server export` renders every page with the server's own code (active),
# links behind the repository's path, plus the browser bundle (WebAssembly), the web
# app manifest and the service worker: the static copy is an installable PWA too.
#
# One-time setup, from a phone browser: GitHub → repository → Settings →
# Pages → Build and deployment → Source: "GitHub Actions". Until then this
# workflow only builds the site and leaves a notice (it does not fail).
#
# GitHub Pages is static: the documentation, animations and navigation work, and the
# security headers become a strict Content-Security-Policy <meta> tag (inline scripts
# allowed by hash). The live attack playground needs the Vitesse server (Heroku, Docker…):
# the static pages say so.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Pushes made by the auto-merge bots do not trigger `push` workflows.
  workflow_run:
    workflows: ["Auto-merge", "Dependabot auto-merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # The repositories are private: Cargo fetches the git dependencies (the other
  # repositories of the ecosystem) through git, which asks GitHub's credentials to a
  # helper reading the REPOS_TOKEN secret, a GitHub token that can read them. The
  # token stays out of every URL; without the secret, nothing changes.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'

jobs:
  build:
    name: Build the website
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Is GitHub Pages enabled with the "GitHub Actions" source?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$BUILD_TYPE" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages not enabled::Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again (Actions → Deploy to GitHub Pages → Run workflow). The site is still built below to check it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Prebuilt wasm-bindgen CLI, same version as the wasm-bindgen crate in Cargo.lock.
      - name: Install wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version

      - name: Base path and public address
        id: base
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Custom domain → served at its root, otherwise under "/<repository>".
          CNAME=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""' 2>/dev/null || true)
          if [ -n "$CNAME" ]; then
            BASE=""
            URL="https://$CNAME"
          else
            BASE="/$REPO_NAME"
            URL="https://${OWNER,,}.github.io/$REPO_NAME"
          fi
          echo "Base path: '$BASE', public address: $URL"
          echo "path=$BASE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build the browser bundle
        run: |
          cargo build -p securite-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/securite_site.wasm

      # Pages, manifest, service worker, sitemap, CSP <meta> tags, 404.html, .nojekyll.
      - name: Export the site
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_URL: ${{ steps.base.outputs.url }}
        run: cargo run --release -p securite-server -- export dist

      - name: Upload the site
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
