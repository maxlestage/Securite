[package]
name = "securite-site"
version = "0.1.0"
description = "Pages, islands and browser bundle of the securite website, written with active."
edition.workspace = true
license-file.workspace = true
publish = false

# The library holds the texts, routes and islands shared by both sides. Natively it also
# renders every page (used by `securite-server`); compiled to WebAssembly it is the
# browser bundle that hydrates the islands and runs the page motion.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
active = { git = "https://github.com/maxlestage/Active" }

# The server side shows the version of the crate in the footer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
securite = { path = "../crates/securite", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { git = "https://github.com/maxlestage/Active", features = ["client"] }
# Pinned exactly: must match the wasm-bindgen CLI (Dockerfile, ci.yml, pages.yml read
# the version from Cargo.lock).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "Element",
  "EventTarget",
  "Headers",
  "HtmlCanvasElement",
  "HtmlElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "PointerEvent",
  "Response",
  "ScrollBehavior",
  "ScrollToOptions",
  "Window",
] }

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
