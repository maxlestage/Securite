[build]
target = "index.html"
dist = "dist"
filehash = true

# Runs build.rs (cargo check executes build scripts) so that
# `generated/content` exists before Trunk copies it into dist/.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["check", "--target", "wasm32-unknown-unknown", "--quiet"]

[tools]
wasm_bindgen = "0.2.129"

[serve]
addresses = ["127.0.0.1"]
port = 8081

# During `trunk serve`, the API is served by `cargo run -p securite-server`.
[[proxy]]
backend = "http://127.0.0.1:8080/api/"
