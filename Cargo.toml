[workspace]
resolver = "3"
members = ["crates/securite", "server"]
exclude = ["site"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxlestage/Securite"
authors = ["maxlestage"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
