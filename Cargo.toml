[workspace]
resolver = "3"
members = ["crates/securite", "crates/pratique", "server", "site"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
authors = ["Maxime Nathan Lestage"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Browser bundle of the website:
# `cargo build -p securite-site --lib --target wasm32-unknown-unknown --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
